<!DOCTYPE html>
<html lang="id" data-build="20261003150503">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>VearVault</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/style.css?v=20261003150503">
</head>
<body>
<div class="orbs" aria-hidden="true"></div>

<header>
  <div class="bar">
    <button class="menubtn" id="menuBtn" type="button" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg><i class="nd" id="menuDot" hidden></i></button>
    <div id="auth"></div>
  </div>
</header>

<section class="hero">
  <div class="hero-top"><h1>Simpan dan bagikan prompt AI</h1><img class="mark" src="assets/logo-sm.png" width="190" height="190" decoding="async" alt=""></div>
  <div class="tools">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Cari prompt" aria-label="Cari prompt">
    </div>
    <button class="btn" id="addBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Tambah prompt
    </button>
  </div>
</section>

<section class="filters">
  <div class="seg" id="seg">
    <button class="on" data-v="all">Semua</button>
    <button data-v="mine">Prompt saya</button>
  </div>
  <div class="chips" id="chips"></div>
</section>

<main><div class="grid" id="grid"></div><div class="more" id="more" hidden><button class="btn" id="moreBtn" type="button">Tampilkan lebih banyak</button></div></main>

<dialog id="dlg">
  <div class="mh"><h2>Tambah prompt</h2><button class="x" id="closeBtn" aria-label="Tutup">&times;</button></div>
  <form id="form">
    <label>Judul<input type="text" id="fTitle" maxlength="80" required></label>
    <label>Deskripsi<textarea id="fDesc" maxlength="300"></textarea></label>
    <div class="fld"><span>AI</span><button type="button" class="pickbtn" id="catBtn"></button><input type="hidden" id="fCat" value="ChatGPT"></div>
    <label>Prompt<textarea id="fBody" required></textarea></label>
    <div class="cnt"><span id="cntN">0 karakter</span><span class="ok" id="cntOk" hidden>Masuk Misi Role</span></div>
    <div class="pub"><span>Jadikan publik</span><label class="sw"><input type="checkbox" id="fPub" checked><span></span></label></div>
    <button class="btn" type="submit" id="saveBtn">Simpan</button>
  </form>
</dialog>

<dialog id="onb">
  <button class="x onb-x" id="onbX" aria-label="Tutup" type="button">&times;</button>
  <div class="steps"><i class="on"></i><i></i><i></i></div>

  <div class="pane on" data-s="1">
    <h2>Nama akun</h2>
    <label>Nama<input type="text" id="oName" maxlength="30" autocomplete="name"></label>
    <button class="btn" id="oNext1" type="button">Lanjut</button>
  </div>

  <div class="pane" data-s="2">
    <div class="ph2">
      <button class="back" data-back type="button" aria-label="Kembali"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <h2>Profil</h2>
    </div>
    <div class="pickwrap" id="pickWrap" role="button" tabindex="0" aria-label="Pilih foto">
      <div class="pick" id="pick"></div>
      <span class="cam"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
    </div>
    <input type="file" id="oFile" accept="image/*" hidden>
    <button class="btn line" id="oNext2" type="button">Lewati</button>
  </div>

  <div class="pane" data-s="3">
    <div class="ph2">
      <button class="back" data-back type="button" aria-label="Kembali"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <h2>Info akun</h2>
    </div>
    <div class="info" id="info"></div>
    <div class="rl">Role</div>
    <div class="roles" id="roles"></div>
    <button class="btn" id="finish" type="button">Selesai</button>
  </div>
</dialog>

<dialog id="prof">
  <div class="pf-bar">
    <button class="back" id="profX" type="button" aria-label="Kembali"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <span>Profil</span>
  </div>
  <div class="pf-wrap">
    <section class="pf-hero" id="pfHero"></section>
    <div class="pf-stats" id="pfStats"></div>
    <div class="pf-acts" id="profSend" hidden><button class="btn" id="pSend" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>Kirim Prompt</button></div>
    <div class="pf-acts" id="profActs" hidden>
      <div class="row2"><button class="btn line" id="pName" type="button">Ganti nama</button><button class="btn line" id="pPhoto" type="button">Ganti PP</button></div>
      <div class="row2"><button class="btn" id="pRole" type="button">Ganti Role</button><button class="btn" id="pMission" type="button">Misi Role</button></div>
      <button class="out" id="pOut" type="button">Keluar</button>
    </div>
    <h3 class="pf-h">Prompt</h3>
    <div class="grid" id="profGrid"></div>
    <div class="more" id="pfMore" hidden><button class="btn" id="pfMoreBtn" type="button">Tampilkan lebih banyak</button></div>
  </div>
</dialog>

<dialog id="ed">
  <button class="x onb-x" id="edX" type="button" aria-label="Tutup">&times;</button>
  <div class="pane on" id="edName">
    <h2>Ganti nama</h2>
    <label>Nama<input type="text" id="edNameIn" maxlength="30" autocomplete="name"></label>
    <button class="btn" id="edNameSave" type="button">Simpan</button>
  </div>
  <div class="pane" id="edPhoto">
    <h2>Ganti PP</h2>
    <div class="pickwrap" id="edPickWrap" role="button" tabindex="0" aria-label="Pilih foto">
      <div class="pick" id="edPick"></div>
      <span class="cam"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
    </div>
    <input type="file" id="edFile" accept="image/*" hidden>
    <button class="btn" id="edPhotoSave" type="button" disabled>Simpan</button>
  </div>
</dialog>

<dialog id="rol">
  <button class="x onb-x" id="rolX" type="button" aria-label="Tutup">&times;</button>
  <div class="pane on"><h2>Ganti Role</h2><div class="roles" id="rolList"></div></div>
</dialog>

<dialog id="mis">
  <button class="x onb-x" id="misX" type="button" aria-label="Tutup">&times;</button>
  <div class="pane on"><h2>Misi Role</h2><div id="misBody"></div></div>
</dialog>

<dialog id="cp">
  <button class="x onb-x" id="cpX" type="button" aria-label="Tutup">&times;</button>
  <div class="pane on"><h2>Pilih AI</h2><div class="aigrid" id="cpList"></div></div>
</dialog>

<dialog id="pv">
  <div class="pv-head">
    <div class="pv-top"><span class="tag" id="pvTag"></span><button class="x" id="pvX" type="button" aria-label="Tutup">&times;</button></div>
    <h2 id="pvTitle"></h2>
    <p class="pv-desc" id="pvDesc" hidden></p>
    <button class="by" id="pvBy" type="button" aria-label="Lihat profil"></button>
  </div>
  <div class="pv-body" id="pvBody"></div>
  <div class="pv-foot"><span class="pv-n" id="pvN"></span><div class="acts" id="pvActs"></div></div>
</dialog>

<dialog id="drawer">
  <div class="dr-head">
    <div class="brand"><img src="assets/logo-sm.png" width="36" height="36" alt="">VearVault</div>
    <button class="x" id="drX" type="button" aria-label="Tutup">&times;</button>
  </div>
  <nav class="dr-nav">
    <button class="dr-item" data-go="chat" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/></svg><span>Chat Global</span></button>
    <button class="dr-item" data-go="box" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 3h6l1-3h5"/></svg><span>Box</span><b class="cb" id="boxBadge" hidden>0</b></button>
    <button class="dr-item" data-go="find" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>Cari Akun</span></button>
  </nav>
</dialog>

<dialog id="chat" class="page chatpage">
  <div class="pf-bar"><button class="back" id="chX" type="button" aria-label="Kembali"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button><span>Chat Global</span></div>
  <div class="ch-list" id="chList"></div>
  <div class="ch-in" id="chIn"></div>
</dialog>

<dialog id="box" class="page">
  <div class="pf-bar"><button class="back" id="bxX" type="button" aria-label="Kembali"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button><span>Box</span></div>
  <div class="bx-wrap" id="bxList"></div>
</dialog>

<dialog id="find" class="page">
  <div class="pf-bar"><button class="back" id="fnX" type="button" aria-label="Kembali"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button><span>Cari Akun</span></div>
  <div class="fn-wrap">
    <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="fnQ" type="search" placeholder="Cari nama akun" aria-label="Cari akun" autocomplete="off"></div>
    <div class="fn-list" id="fnList"></div>
  </div>
</dialog>

<dialog id="sd">
  <div class="mh"><h2>Kirim Prompt</h2><button class="x" id="sdX" type="button" aria-label="Tutup">&times;</button></div>
  <form id="sdForm">
    <div class="sdto" id="sdTo"></div>
    <label>Judul<input type="text" id="sTitle" maxlength="80" required></label>
    <label>Deskripsi<textarea id="sDesc" maxlength="300"></textarea></label>
    <div class="fld"><span>AI</span><button type="button" class="pickbtn" id="sCatBtn"></button><input type="hidden" id="sCat" value="ChatGPT"></div>
    <label>Prompt<textarea id="sBody" required></textarea></label>
    <button class="btn" type="submit" id="sdSend">Kirim</button>
  </form>
</dialog>

<dialog id="mv" class="lb"><img id="mvImg" alt=""></dialog>

<div class="toast" id="toast"></div>

<script defer src="js/update.js?v=20261003150503"></script>
<script defer src="js/lock.js?v=20261003150503"></script>
<script defer src="js/config.js?v=20261003150503"></script>
<script defer src="js/core.js?v=20261003150503"></script>
<script defer src="js/auth.js?v=20261003150503"></script>
<script defer src="js/prompts.js?v=20261003150503"></script>
<script defer src="js/account.js?v=20261003150503"></script>
<script defer src="js/profile.js?v=20261003150503"></script>
<script defer src="js/role.js?v=20261003150503"></script>
<script defer src="js/picker.js?v=20261003150503"></script>
<script defer src="js/viewer.js?v=20261003150503"></script>
<script defer src="js/menu.js?v=20261003150503"></script>
<script defer src="js/chat.js?v=20261003150503"></script>
<script defer src="js/box.js?v=20261003150503"></script>
<script defer src="js/find.js?v=20261003150503"></script>
<script defer src="js/main.js?v=20261003150503"></script>
</body>
</html>
