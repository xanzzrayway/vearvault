<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APK Compiler — Abid Studio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --bg:#080b11;
    --panel:#0f1620;
    --panel2:#0b111a;
    --line:#1c2836;
    --line-soft:#141d29;
    --accent:#7c6cff;
    --accent-soft:#5b4fe0;
    --accent2:#00e5c7;
    --text:#e4ecf5;
    --dim:#5f7488;
    --dim2:#3c4c5c;
    --err:#ff5c7a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 10% -5%, rgba(124,108,255,0.16), transparent 42%),
      radial-gradient(circle at 90% 105%, rgba(0,229,199,0.09), transparent 48%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    min-height:100vh;
    padding:22px 14px 60px;
  }
  .wrap{max-width:520px;margin:0 auto;}

  header{display:flex;align-items:center;gap:12px;margin-bottom:24px;}
  .logo{
    width:42px;height:42px;border-radius:12px;flex-shrink:0;
    background:linear-gradient(135deg, var(--accent), var(--accent-soft));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(124,108,255,0.35);
  }
  .logo svg{width:22px;height:22px;stroke:#fff;}
  .htext .tag{color:var(--accent2);font-size:10.5px;letter-spacing:3px;text-transform:uppercase;font-weight:600;}
  .htext h1{font-size:20px;margin:2px 0 2px;letter-spacing:0.3px;}
  .htext .sub{color:var(--dim);font-size:12px;}

  .card{
    background:linear-gradient(180deg, var(--panel), var(--panel2));
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px;
    margin-bottom:14px;
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
  }
  .card h2{
    font-size:11.5px;text-transform:uppercase;letter-spacing:2px;color:var(--accent2);
    margin:0 0 14px;display:flex;align-items:center;gap:7px;
  }
  .card h2 svg{width:14px;height:14px;stroke:var(--accent2);}

  label{display:block;font-size:12px;color:var(--dim);margin:12px 0 6px;}
  label:first-of-type{margin-top:0;}
  input[type=text], input[type=password], textarea{
    width:100%;
    background:#060a10;
    border:1px solid var(--line);
    color:var(--text);
    padding:11px 12px;
    border-radius:8px;
    font-family:inherit;
    font-size:13.5px;
    transition:border-color .15s;
  }
  textarea{min-height:120px;resize:vertical;font-family:'SF Mono', 'Courier New', monospace;font-size:12px;}
  input:focus, textarea:focus{outline:none;border-color:var(--accent);}
  input::placeholder, textarea::placeholder{color:var(--dim2);}

  .tabs{display:flex;gap:8px;margin-bottom:4px;}
  .tab{
    flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    padding:10px;border-radius:8px;
    border:1px solid var(--line);color:var(--dim);font-size:12.5px;cursor:pointer;
    background:#060a10;transition:all .15s;
  }
  .tab svg{width:14px;height:14px;stroke:currentColor;}
  .tab.active{border-color:var(--accent);color:var(--text);background:rgba(124,108,255,0.14);}

  .mode-panel{display:none;}
  .mode-panel.active{display:block;}

  .icon-row{display:flex;align-items:center;gap:12px;margin-top:6px;}
  .icon-preview{
    width:54px;height:54px;border-radius:13px;flex-shrink:0;
    background:#060a10;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .icon-preview img{width:100%;height:100%;object-fit:cover;}
  .icon-preview svg{width:22px;height:22px;stroke:var(--dim2);}

  .filebtn{
    flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
    font-size:12px;color:var(--accent2);
    border:1px dashed var(--line);padding:12px;border-radius:8px;text-align:center;cursor:pointer;
    transition:border-color .15s;
  }
  .filebtn:active{border-color:var(--accent2);}
  .filebtn svg{width:14px;height:14px;stroke:currentColor;}

  button.main{
    width:100%;padding:14px;margin-top:18px;
    background:linear-gradient(90deg, var(--accent), var(--accent-soft));
    border:none;color:#fff;border-radius:10px;
    font-family:inherit;font-size:13.5px;letter-spacing:1.2px;text-transform:uppercase;font-weight:600;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:0 8px 20px rgba(124,108,255,0.28);
  }
  button.main svg{width:16px;height:16px;stroke:#fff;}
  button.main:disabled{opacity:0.4;cursor:not-allowed;box-shadow:none;}

  .log{
    font-size:12px;background:#060a10;border:1px solid var(--line);border-radius:8px;
    padding:12px;max-height:220px;overflow-y:auto;font-family:'SF Mono','Courier New',monospace;
  }
  .log div{padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.03);color:var(--dim);display:flex;gap:7px;align-items:flex-start;}
  .log div.ok{color:var(--accent2);}
  .log div.err{color:var(--err);}
  .log div svg{width:12px;height:12px;flex-shrink:0;margin-top:2px;stroke:currentColor;}

  .dl{
    display:none;margin-top:14px;text-align:center;padding:14px;
    background:rgba(0,229,199,0.08);border:1px solid var(--accent2);border-radius:10px;
  }
  .dl a{
    color:var(--accent2);font-weight:600;text-decoration:none;font-size:13.5px;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .dl a svg{width:15px;height:15px;stroke:currentColor;}

  .hint{font-size:11px;color:var(--dim);margin-top:6px;line-height:1.5;}

  .history-item{
    display:flex;align-items:center;gap:11px;padding:11px 0;
    border-bottom:1px solid var(--line-soft);
  }
  .history-item:last-child{border-bottom:none;}
  .h-status{
    width:30px;height:30px;border-radius:9px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .h-status.ok{background:rgba(0,229,199,0.12);}
  .h-status.err{background:rgba(255,92,122,0.12);}
  .h-status svg{width:15px;height:15px;}
  .h-status.ok svg{stroke:var(--accent2);}
  .h-status.err svg{stroke:var(--err);}
  .h-body{flex:1;min-width:0;}
  .h-name{font-size:13px;font-weight:600;}
  .h-meta{font-size:11px;color:var(--dim);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;}
  .h-empty{font-size:12.5px;color:var(--dim);text-align:center;padding:10px 0;}

  .h-actions{display:flex;gap:6px;flex-shrink:0;}
  .h-btn{
    width:28px;height:28px;border-radius:8px;border:1px solid var(--line);
    background:#060a10;display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;transition:border-color .15s;
  }
  .h-btn:active{border-color:var(--accent);}
  .h-btn svg{width:14px;height:14px;stroke:var(--dim);}

  .limit-bar-wrap{margin-top:2px;margin-bottom:16px;}
  .limit-bar-label{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-bottom:5px;}
  .bar-track{width:100%;height:7px;border-radius:5px;background:#060a10;border:1px solid var(--line);overflow:hidden;}
  .bar-fill{height:100%;border-radius:5px;background:linear-gradient(90deg, var(--accent), var(--accent2));transition:width .3s;width:0%;}
  .bar-fill.full{background:linear-gradient(90deg, var(--err), #ff8a5c);}

  .progress-wrap{margin-bottom:12px;}
  .progress-label{font-size:11px;color:var(--dim);margin-bottom:5px;display:flex;justify-content:space-between;}

  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(3,6,10,0.72);
    z-index:50;align-items:flex-end;justify-content:center;
  }
  .modal-overlay.show{display:flex;}
  .modal-box{
    width:100%;max-width:520px;background:linear-gradient(180deg, var(--panel), var(--panel2));
    border:1px solid var(--line);border-top-left-radius:18px;border-top-right-radius:18px;
    padding:20px;max-height:82vh;overflow-y:auto;
  }
  .modal-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .modal-head img, .modal-head .ph{
    width:48px;height:48px;border-radius:12px;object-fit:cover;background:#060a10;border:1px solid var(--line);flex-shrink:0;
  }
  .modal-head .ph{display:flex;align-items:center;justify-content:center;}
  .modal-head .ph svg{width:20px;height:20px;stroke:var(--dim2);}
  .modal-title{font-size:15px;font-weight:600;flex:1;min-width:0;word-break:break-word;}
  .modal-close{
    margin-left:auto;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);
    background:#060a10;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
  }
  .modal-close svg{width:14px;height:14px;stroke:var(--dim);}
  .info-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px;}
  .info-row:last-child{border-bottom:none;}
  .info-row .k{color:var(--dim);flex-shrink:0;}
  .info-row .v{font-weight:600;text-align:right;max-width:65%;word-break:break-all;}

  .perm-search input{margin-bottom:10px;}
  .perm-list{max-height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;}
  .perm-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;
    border-bottom:1px solid var(--line-soft);cursor:pointer;
  }
  .perm-item:last-child{border-bottom:none;}
  .perm-item input{width:16px;height:16px;flex-shrink:0;accent-color:var(--accent);}
  .perm-name{font-size:12.5px;font-weight:600;}
  .perm-desc{font-size:10.5px;color:var(--dim);margin-top:1px;}
  .perm-empty{font-size:12px;color:var(--dim);text-align:center;padding:16px 0;}
  .perm-selected{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .perm-chip{
    font-size:10.5px;background:rgba(124,108,255,0.14);border:1px solid var(--accent);color:var(--text);
    padding:4px 8px 4px 10px;border-radius:20px;display:flex;align-items:center;gap:6px;
  }
  .perm-chip button{background:none;border:none;color:var(--dim);cursor:pointer;font-size:13px;line-height:1;padding:0;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4.5v9L12 20l-8-4.5v-9L12 2z"/><path d="M12 22V12"/><path d="M20 6.5L12 12 4 6.5"/></svg>
    </div>
    <div class="htext">
      <div class="tag">Abid Studio</div>
      <h1>APK Compiler</h1>
      <div class="sub">Ubah link web atau file HTML jadi APK Android.</div>
    </div>
  </header>

  <div class="card">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>Detail App</h2>
    <label>Nama App</label>
    <input type="text" id="appName" placeholder="Aplikasi Gue">
    <label>Package Name</label>
    <input type="text" id="pkgName" placeholder="com.abidstudio.aplikasigue">
    <label>Versi App</label>
    <input type="text" id="appVersion" placeholder="1.0">

    <label>Icon App (opsional)</label>
    <div class="icon-row">
      <div class="icon-preview" id="iconPreview">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      </div>
      <div class="filebtn" id="iconBtnLabel">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M4 17v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg>
        Upload icon
      </div>
      <input type="file" id="iconFile" accept="image/*" style="display:none;">
    </div>
    <div class="hint"></div>

    <label style="margin-top:16px;">Sumber Konten</label>
    <div class="tabs">
      <div class="tab active" data-mode="url">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007.07 0l2.83-2.83a5 5 0 00-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 00-7.07 0L4.1 13.83a5 5 0 007.07 7.07l1.5-1.5"/></svg>
        Link Web
      </div>
      <div class="tab" data-mode="html">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
        File HTML
      </div>
    </div>

    <div class="mode-panel active" id="panel-url">
      <label>URL</label>
      <input type="text" id="urlInput" placeholder="Contoh https://example.com">
    </div>

    <div class="mode-panel" id="panel-html">
      <label>Tempel kode HTML, atau upload file</label>
      <textarea id="htmlInput" placeholder="<!DOCTYPE html>..."></textarea>
      <div class="filebtn" id="fileBtnLabel" style="margin-top:8px;">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
        Upload file .html
      </div>
      <input type="file" id="htmlFile" accept=".html,.htm" style="display:none;">
    </div>

    <button class="main" id="compileBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      Compile ke APK
    </button>
  </div>

  <div class="card">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>Izin Aplikasi</h2>
    <label></label>
    <div class="perm-search">
      <input type="text" id="permSearch" placeholder="Cari izin...">
    </div>
    <div class="perm-list" id="permList"></div>
    <div class="perm-selected" id="permSelected"></div>
    <div class="hint"></div>
  </div>

  <div class="card" id="logCard" style="display:none;">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Progres</h2>
    <div class="progress-wrap">
      <div class="progress-label"><span id="progressStage">Menunggu...</span><span id="progressPercent">0%</span></div>
      <div class="bar-track"><div class="bar-fill" id="compileBarFill"></div></div>
    </div>
    <div class="log" id="logBox"></div>
    <div class="dl" id="dlBox">
      <a id="dlLink" href="#" download>
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 12l5 5 5-5"/><path d="M5 21h14"/></svg>
        Download APK
      </a>
    </div>
  </div>

  <div class="card">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>Riwayat Compile</h2>
    <div class="limit-bar-wrap">
      <div class="limit-bar-label"><span>Limit Harian</span><span id="limitCountLabel">0/5</span></div>
      <div class="bar-track"><div class="bar-fill" id="limitBarFill"></div></div>
    </div>
    <div id="historyList"><div class="h-empty">Belum ada riwayat compile.</div></div>
  </div>
</div>

<div class="modal-overlay" id="infoModal">
  <div class="modal-box">
    <div class="modal-head">
      <div class="ph" id="modalIconWrap">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      </div>
      <div class="modal-title" id="modalAppName">-</div>
      <div class="modal-close" id="modalCloseBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </div>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

// Token GitHub SEKARANG di server (Netlify Function), bukan disini lagi.
// Frontend cuma manggil endpoint /api/... punya kita sendiri.
const API_BASE = '/api';

// load saved app name/package/versi
['appName','pkgName','appVersion'].forEach(id=>{
  const v = localStorage.getItem(id);
  if(v) $(id).value = v;
});
if(!$('appVersion').value) $('appVersion').value = '1.0';

// ====== Daftar izin android yang bisa dipilih ======
const PERMISSIONS = [
  { manifest:'android.permission.INTERNET', label:'Internet', desc:'Akses ke internet' },
  { manifest:'android.permission.ACCESS_NETWORK_STATE', label:'Status Jaringan', desc:'Cek koneksi internet aktif/tidak' },
  { manifest:'android.permission.CAMERA', label:'Kamera / Senter', desc:'Akses kamera, termasuk nyalain senter (flash)' },
  { manifest:'android.permission.RECORD_AUDIO', label:'Mikrofon', desc:'Rekam suara / akses mikrofon' },
  { manifest:'android.permission.ACCESS_COARSE_LOCATION', label:'Lokasi (Perkiraan)', desc:'Lokasi perkiraan berbasis jaringan' },
  { manifest:'android.permission.ACCESS_FINE_LOCATION', label:'Lokasi (Presisi)', desc:'Lokasi presisi berbasis GPS' },
  { manifest:'android.permission.ACCESS_BACKGROUND_LOCATION', label:'Lokasi Latar Belakang', desc:'Akses lokasi walau app ditutup' },
  { manifest:'android.permission.READ_EXTERNAL_STORAGE', label:'Baca Penyimpanan', desc:'Baca file di penyimpanan device' },
  { manifest:'android.permission.WRITE_EXTERNAL_STORAGE', label:'Tulis Penyimpanan', desc:'Simpan file ke penyimpanan device' },
  { manifest:'android.permission.READ_MEDIA_IMAGES', label:'Baca Foto/Gambar', desc:'Akses galeri foto (Android 13+)' },
  { manifest:'android.permission.READ_MEDIA_VIDEO', label:'Baca Video', desc:'Akses galeri video (Android 13+)' },
  { manifest:'android.permission.READ_CONTACTS', label:'Baca Kontak', desc:'Akses daftar kontak' },
  { manifest:'android.permission.WRITE_CONTACTS', label:'Tulis Kontak', desc:'Tambah/ubah kontak' },
  { manifest:'android.permission.READ_CALENDAR', label:'Baca Kalender', desc:'Akses event kalender' },
  { manifest:'android.permission.WRITE_CALENDAR', label:'Tulis Kalender', desc:'Tambah/ubah event kalender' },
  { manifest:'android.permission.SEND_SMS', label:'Kirim SMS', desc:'Kirim pesan SMS' },
  { manifest:'android.permission.READ_SMS', label:'Baca SMS', desc:'Baca pesan SMS masuk' },
  { manifest:'android.permission.CALL_PHONE', label:'Panggil Telepon', desc:'Lakukan panggilan telepon langsung' },
  { manifest:'android.permission.READ_PHONE_STATE', label:'Status Telepon', desc:'Baca status & info nomor telepon' },
  { manifest:'android.permission.READ_CALL_LOG', label:'Riwayat Panggilan', desc:'Baca log panggilan masuk/keluar' },
  { manifest:'android.permission.POST_NOTIFICATIONS', label:'Notifikasi', desc:'Kirim notifikasi ke user (Android 13+)' },
  { manifest:'android.permission.SYSTEM_ALERT_WINDOW', label:'Tampil di Atas Aplikasi Lain', desc:'Overlay / alert window (floating widget)' },
  { manifest:'android.permission.VIBRATE', label:'Getar', desc:'Aktifkan getar device' },
  { manifest:'android.permission.BLUETOOTH_CONNECT', label:'Bluetooth Connect', desc:'Sambung ke perangkat bluetooth' },
  { manifest:'android.permission.BLUETOOTH_SCAN', label:'Bluetooth Scan', desc:'Cari perangkat bluetooth sekitar' },
  { manifest:'android.permission.ACCESS_WIFI_STATE', label:'Status Wi-Fi', desc:'Cek status koneksi Wi-Fi' },
  { manifest:'android.permission.CHANGE_WIFI_STATE', label:'Ubah Wi-Fi', desc:'Nyalain/matiin atau ubah koneksi Wi-Fi' },
  { manifest:'android.permission.RECEIVE_BOOT_COMPLETED', label:'Auto-start Saat Boot', desc:'Jalan otomatis pas device baru nyala' },
  { manifest:'android.permission.WAKE_LOCK', label:'Wake Lock', desc:'Cegah device tidur/layar mati' },
  { manifest:'android.permission.USE_BIOMETRIC', label:'Biometrik / Fingerprint', desc:'Autentikasi sidik jari / wajah' },
  { manifest:'android.permission.BODY_SENSORS', label:'Sensor Tubuh', desc:'Akses sensor detak jantung dll' },
  { manifest:'android.permission.NFC', label:'NFC', desc:'Akses fitur NFC' },
  { manifest:'android.permission.FOREGROUND_SERVICE', label:'Foreground Service', desc:'Jalanin proses/layanan di background terus' },
];

let selectedPermissions = JSON.parse(localStorage.getItem('selectedPermissions') || '[]');

function isPermSelected(m){ return selectedPermissions.includes(m); }

function renderPermList(filter=''){
  const box = $('permList');
  const f = filter.trim().toLowerCase();
  const items = PERMISSIONS.filter(p => !f || p.label.toLowerCase().includes(f) || p.desc.toLowerCase().includes(f) || p.manifest.toLowerCase().includes(f));
  if(items.length === 0){
    box.innerHTML = '<div class="perm-empty">Izin gak ketemu.</div>';
    return;
  }
  box.innerHTML = items.map(p => {
    const checked = isPermSelected(p.manifest) ? 'checked' : '';
    return '<label class="perm-item">' +
      '<input type="checkbox" data-perm="' + p.manifest + '" ' + checked + '>' +
      '<div><div class="perm-name">' + p.label + '</div><div class="perm-desc">' + p.desc + '</div></div>' +
    '</label>';
  }).join('');
  box.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.onchange = () => {
      const m = cb.dataset.perm;
      if(cb.checked){ if(!selectedPermissions.includes(m)) selectedPermissions.push(m); }
      else { selectedPermissions = selectedPermissions.filter(x => x !== m); }
      localStorage.setItem('selectedPermissions', JSON.stringify(selectedPermissions));
      renderPermSelected();
    };
  });
}

function renderPermSelected(){
  const box = $('permSelected');
  if(selectedPermissions.length === 0){ box.innerHTML = ''; return; }
  box.innerHTML = selectedPermissions.map(m => {
    const meta = PERMISSIONS.find(p => p.manifest === m);
    const label = meta ? meta.label : m;
    return '<span class="perm-chip">' + label + '<button data-perm="' + m + '">&times;</button></span>';
  }).join('');
  box.querySelectorAll('button').forEach(btn => {
    btn.onclick = () => {
      const m = btn.dataset.perm;
      selectedPermissions = selectedPermissions.filter(x => x !== m);
      localStorage.setItem('selectedPermissions', JSON.stringify(selectedPermissions));
      renderPermSelected();
      renderPermList($('permSearch').value);
    };
  });
}

$('permSearch').oninput = (e) => renderPermList(e.target.value);
renderPermList();
renderPermSelected();

// ====== Batas compile harian ======
const DAILY_LIMIT = 5;
function getTodayKey(){ return new Date().toISOString().slice(0,10); }
function getLimitData(){
  let data;
  try{ data = JSON.parse(localStorage.getItem('compileLimit') || '{}'); }
  catch(e){ data = {}; }
  if(data.date !== getTodayKey()) data = { date: getTodayKey(), count: 0 };
  return data;
}
function getCompileCountToday(){ return getLimitData().count; }
function incCompileCountToday(){
  const data = getLimitData();
  data.count++;
  localStorage.setItem('compileLimit', JSON.stringify(data));
  renderLimitBar();
}
function renderLimitBar(){
  const count = getCompileCountToday();
  const pct = Math.min(100, (count / DAILY_LIMIT) * 100);
  const fill = $('limitBarFill');
  fill.style.width = pct + '%';
  fill.classList.toggle('full', count >= DAILY_LIMIT);
  $('limitCountLabel').textContent = count + '/' + DAILY_LIMIT;
  $('compileBtn').disabled = count >= DAILY_LIMIT;
}
renderLimitBar();

// ====== Progress bar compile ======
function setCompileProgress(pct, stage){
  $('compileBarFill').style.width = Math.min(100, Math.max(0, pct)) + '%';
  $('progressPercent').textContent = Math.round(Math.min(100, Math.max(0, pct))) + '%';
  if(stage) $('progressStage').textContent = stage;
}

// ====== Modal info APK ======
function formatBytes(bytes){
  if(!bytes && bytes !== 0) return '-';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/(1024*1024)).toFixed(2) + ' MB';
}
function openInfoModal(entry){
  $('modalAppName').textContent = entry.appName;
  const iconWrap = $('modalIconWrap');
  if(entry.iconThumb){
    iconWrap.innerHTML = '<img src="' + entry.iconThumb + '">';
  } else {
    iconWrap.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>';
  }
  const rows = [
    ['Nama APK', entry.appName],
    ['Package', entry.pkgName || '-'],
    ['Versi', entry.version || '-'],
    ['Ukuran', formatBytes(entry.sizeBytes)],
    ['Dibuat', entry.date],
    ['Sumber', entry.mode === 'url' ? 'Link Web' : 'File HTML'],
    ['Status', entry.status === 'success' ? 'Sukses' : 'Gagal']
  ];
  $('modalBody').innerHTML = rows.map(r =>
    '<div class="info-row"><span class="k">' + r[0] + '</span><span class="v">' + String(r[1]).replace(/</g,'&lt;') + '</span></div>'
  ).join('');
  $('infoModal').classList.add('show');
}
$('modalCloseBtn').onclick = () => $('infoModal').classList.remove('show');
$('infoModal').onclick = (e) => { if(e.target.id === 'infoModal') $('infoModal').classList.remove('show'); };

// ====== Download ulang dari riwayat ======
async function redownloadEntry(entry){
  if(!entry.runId){ log('Data run build lama gak ada, gak bisa download ulang.', 'err'); return; }
  log('Ambil ulang APK "' + entry.appName + '" dari server...', 'info');
  try{
    const zipRes = await apiFetch('/download-artifact?runId=' + entry.runId);
    if(!zipRes.ok){ log('Artifact udah gak ada (mungkin expired).', 'err'); return; }
    const zipBlob = await zipRes.blob();
    const zip = await JSZip.loadAsync(zipBlob);
    const apkFileName = Object.keys(zip.files).find(n => n.endsWith('.apk'));
    if(!apkFileName){ log('File .apk gak ketemu di artifact.', 'err'); return; }
    const apkBlob = await zip.files[apkFileName].async('blob');
    const url = URL.createObjectURL(apkBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = entry.appName + '.apk';
    document.body.appendChild(a);
    a.click();
    a.remove();
    log('Download ulang berhasil.', 'ok');
  }catch(e){
    log('Gagal download ulang: ' + e.message, 'err');
  }
}

// tab switching
let currentMode = 'url';
document.querySelectorAll('.tab').forEach(tab=>{
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.mode-panel').forEach(p=>p.classList.remove('active'));
    tab.classList.add('active');
    currentMode = tab.dataset.mode;
    $('panel-'+currentMode).classList.add('active');
  };
});

$('fileBtnLabel').onclick = () => $('htmlFile').click();
$('htmlFile').onchange = (e) => {
  const f = e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = () => { $('htmlInput').value = reader.result; };
  reader.readAsText(f);
};

// icon upload - resize jadi 192x192 PNG base64 lewat canvas
let iconBase64 = null;
$('iconBtnLabel').onclick = () => $('iconFile').click();
$('iconFile').onchange = (e) => {
  const f = e.target.files[0];
  if(!f) return;
  const img = new Image();
  const reader = new FileReader();
  reader.onload = () => {
    img.onload = () => {
      const size = 192;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const side = Math.min(img.width, img.height);
      const sx = (img.width - side) / 2;
      const sy = (img.height - side) / 2;
      ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
      const dataUrl = canvas.toDataURL('image/png');
      iconBase64 = dataUrl.split(',')[1];
      $('iconPreview').innerHTML = '<img src="' + dataUrl + '">';
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(f);
};

function log(msg, cls, iconSvg){
  $('logCard').style.display = 'block';
  const d = document.createElement('div');
  if(cls) d.className = cls;
  const icons = {
    ok: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
    err: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>',
    info: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>'
  };
  d.innerHTML = (icons[cls] || icons.info) + '<span>' + msg.replace(/</g,'&lt;') + '</span>';
  $('logBox').appendChild(d);
  $('logBox').scrollTop = $('logBox').scrollHeight;
}

function b64EncodeUnicode(str){
  return btoa(unescape(encodeURIComponent(str)));
}

async function apiFetch(path, opts={}){
  const res = await fetch(API_BASE + path, opts);
  return res;
}

// riwayat compile - disimpan di localStorage
function loadHistory(){
  try{ return JSON.parse(localStorage.getItem('compileHistory') || '[]'); }
  catch(e){ return []; }
}
function saveHistoryEntry(entry){
  const hist = loadHistory();
  hist.unshift(entry);
  while(hist.length > 20) hist.pop();
  localStorage.setItem('compileHistory', JSON.stringify(hist));
  renderHistory();
}
function renderHistory(){
  const hist = loadHistory();
  const box = $('historyList');
  if(hist.length === 0){
    box.innerHTML = '<div class="h-empty">Belum ada riwayat compile.</div>';
    return;
  }
  box.innerHTML = hist.map((h, i) => {
    const okIcon = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
    const errIcon = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>';
    const infoIcon = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>';
    const dlIcon = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 12l5 5 5-5"/><path d="M5 21h14"/></svg>';
    const statusCls = h.status === 'success' ? 'ok' : 'err';
    const modeLabel = h.mode === 'url' ? 'Link' : 'HTML';
    const canRedownload = h.status === 'success' && h.runId;
    return '<div class="history-item">' +
      '<div class="h-status ' + statusCls + '">' + (h.status === 'success' ? okIcon : errIcon) + '</div>' +
      '<div class="h-body">' +
        '<div class="h-name">' + h.appName.replace(/</g,'&lt;') + '</div>' +
        '<div class="h-meta"><span>' + modeLabel + '</span><span>' + h.date + '</span></div>' +
      '</div>' +
      '<div class="h-actions">' +
        '<div class="h-btn" data-info="' + i + '" title="Info APK">' + infoIcon + '</div>' +
        (canRedownload ? '<div class="h-btn" data-redownload="' + i + '" title="Download ulang">' + dlIcon + '</div>' : '') +
      '</div>' +
    '</div>';
  }).join('');

  box.querySelectorAll('[data-info]').forEach(btn => {
    btn.onclick = () => openInfoModal(hist[Number(btn.dataset.info)]);
  });
  box.querySelectorAll('[data-redownload]').forEach(btn => {
    btn.onclick = () => redownloadEntry(hist[Number(btn.dataset.redownload)]);
  });
}
renderHistory();

$('compileBtn').onclick = async () => {
  if(getCompileCountToday() >= DAILY_LIMIT){
    log('Kuota compile hari ini udah habis (maks ' + DAILY_LIMIT + 'x). Coba lagi besok.', 'err');
    return;
  }

  const appName = $('appName').value.trim() || 'MyApp';
  const pkgName = $('pkgName').value.trim() || 'com.abidstudio.myapp';
  const version = $('appVersion').value.trim() || '1.0';

  localStorage.setItem('appName', appName);
  localStorage.setItem('pkgName', pkgName);
  localStorage.setItem('appVersion', version);

  let mode, content;
  if(currentMode === 'url'){
    mode = 'url';
    content = $('urlInput').value.trim();
    if(!content){ log('Isi dulu URL-nya.', 'err'); return; }
  } else {
    mode = 'html';
    const raw = $('htmlInput').value;
    if(!raw.trim()){ log('Tempel/upload HTML dulu.', 'err'); return; }
    content = b64EncodeUnicode(raw);
  }

  $('compileBtn').disabled = true;
  $('logBox').innerHTML = '';
  $('dlBox').style.display = 'none';
  setCompileProgress(5, 'Mengirim trigger build...');
  log('Mengirim trigger build ke GitHub Actions...', 'info');

  const triggerTime = new Date();
  const dateLabel = triggerTime.toLocaleString('id-ID', {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});

  let historySaved = false;
  function finishHistory(status, extra={}){
    if(historySaved) return;
    historySaved = true;
    incCompileCountToday();
    saveHistoryEntry({
      appName, pkgName, version, mode, date: dateLabel, status,
      iconThumb: iconBase64 ? ('data:image/png;base64,' + iconBase64) : null,
      ...extra
    });
  }

  try{
    const payload = { app_name: appName, package_name: pkgName, version, mode, content, permissions: selectedPermissions };
    if(iconBase64) payload.icon_b64 = iconBase64;

    const dispatchRes = await apiFetch('/dispatch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if(!dispatchRes.ok){
      const err = await dispatchRes.text();
      log('Gagal trigger: ' + dispatchRes.status + ' — ' + err, 'err');
      setCompileProgress(100, 'Gagal');
      finishHistory('failure');
      $('compileBtn').disabled = false;
      return;
    }

    setCompileProgress(15, 'Nunggu workflow mulai...');
    log('Build dipicu. Nunggu workflow mulai jalan...', 'ok');

    let runId = null;
    for(let i=0; i<15 && !runId; i++){
      setCompileProgress(15 + (i/15)*20, 'Nunggu workflow mulai... (' + (i+1) + '/15)');
      await new Promise(r=>setTimeout(r, 4000));
      const runsRes = await apiFetch('/find-run?since=' + encodeURIComponent(triggerTime.toISOString()));
      const runsData = await runsRes.json();
      if(runsData.runId) runId = runsData.runId;
    }

    if(!runId){
      log('Belum ketemu run-nya. Cek manual di tab Actions repo kamu.', 'err');
      setCompileProgress(100, 'Gagal');
      finishHistory('failure');
      $('compileBtn').disabled = false;
      return;
    }

    setCompileProgress(35, 'Build jalan (run #' + runId + ')...');
    log('Ketemu run #' + runId + '. Nunggu proses build selesai...', 'info');

    let done = false, conclusion = null, pollCount = 0;
    while(!done){
      pollCount++;
      setCompileProgress(Math.min(90, 35 + pollCount*3), 'Nge-build APK...');
      await new Promise(r=>setTimeout(r, 8000));
      const runRes = await apiFetch('/run-status?id=' + runId);
      const runData = await runRes.json();
      log('Status: ' + runData.status + (runData.conclusion ? ' / ' + runData.conclusion : ''), 'info');
      if(runData.status === 'completed'){
        done = true;
        conclusion = runData.conclusion;
      }
    }

    if(conclusion !== 'success'){
      log('Build gagal (' + conclusion + '). Cek log di tab Actions repo kamu.', 'err');
      setCompileProgress(100, 'Gagal');
      finishHistory('failure', { runId });
      $('compileBtn').disabled = false;
      return;
    }

    setCompileProgress(92, 'Build sukses, ambil APK...');
    log('Build sukses! Ambil APK...', 'ok');

    const zipRes = await apiFetch('/download-artifact?runId=' + runId);
    if(!zipRes.ok){
      log('Artifact APK tidak ketemu.', 'err');
      setCompileProgress(100, 'Gagal');
      finishHistory('failure', { runId });
      $('compileBtn').disabled = false;
      return;
    }
    const zipBlob = await zipRes.blob();
    const zip = await JSZip.loadAsync(zipBlob);
    const apkFileName = Object.keys(zip.files).find(n => n.endsWith('.apk'));
    if(!apkFileName){
      log('Gak nemu file .apk di dalam artifact.', 'err');
      setCompileProgress(100, 'Gagal');
      finishHistory('failure', { runId });
      $('compileBtn').disabled = false;
      return;
    }
    const apkBlob = await zip.files[apkFileName].async('blob');
    const url = URL.createObjectURL(apkBlob);
    $('dlLink').href = url;
    $('dlLink').download = appName + '.apk';
    $('dlBox').style.display = 'block';
    setCompileProgress(100, 'Selesai!');
    log('Selesai! Klik tombol download di atas.', 'ok');
    finishHistory('success', { runId, sizeBytes: apkBlob.size });

  }catch(e){
    log('Error: ' + e.message, 'err');
    setCompileProgress(100, 'Gagal');
    finishHistory('failure');
  }

  $('compileBtn').disabled = false;
  renderLimitBar();
};
